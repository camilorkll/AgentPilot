services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentpilot-db
    environment:
      POSTGRES_DB: agentpilot
      POSTGRES_USER: agentpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentpilot_dev}
    ports:
      # Host 5433 -> contenedor 5432. Usamos 5433 en el host para no chocar con
      # un PostgreSQL nativo que pueda estar ocupando el 5432 de Windows.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpilot -d agentpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/AgentPilot.Api/Dockerfile
    container_name: agentpilot-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Database=agentpilot;Username=agentpilot;Password=${POSTGRES_PASSWORD:-agentpilot_dev}
      OpenAI__ApiKey: ${OPENAI_API_KEY:?Define OPENAI_API_KEY en .env}
      OpenAI__ChatModel: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      Embeddings__Provider: ${EMBEDDINGS_PROVIDER:-openai}
      Embeddings__OllamaBaseUrl: http://ollama:11434
      # Comparativa local de chat (paso 8.11): Ollama corre en el equipo anfitrión, no
      # en un contenedor -aquí no hay GPU que pasar, y así basta instalar Ollama en
      # Windows y `ollama pull` el modelo, sin tocar el volumen del servicio de abajo
      # (que es el de los *embeddings*, un proveedor distinto). Ollama no va a
      # producción: es solo para medir frente a OpenAI, ver evals/COMPARATIVA-MODELOS.md.
      Chat__Provider: ${CHAT_PROVIDER:-openai}
      Chat__OllamaBaseUrl: ${CHAT_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      Chat__OllamaModel: ${CHAT_OLLAMA_MODEL:-llama3.2:3b}
      Chat__OllamaNumCtx: ${CHAT_OLLAMA_NUM_CTX:-4096}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Define JWT_SIGNING_KEY en .env}
      Sentry__Dsn: ${SENTRY_DSN:-}
    extra_hosts:
      # host.docker.internal ya funciona sin esto en Docker Desktop (Windows/Mac);
      # en Docker Engine sobre Linux hace falta esta entrada para resolverlo.
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Proveedor local de embeddings (opcional): docker compose --profile local up
  ollama:
    image: ollama/ollama:latest
    container_name: agentpilot-ollama
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
