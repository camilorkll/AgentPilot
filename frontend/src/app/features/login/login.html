<div class="wrap">
  <div class="card login-card">
    <h1>🎧 AgentPilot</h1>
    <p class="muted small">
      Copiloto de conocimiento para agentes de contact center.
    </p>

    @if (notice()) {
      <p class="notice small">{{ notice() }}</p>
    }

    <form (ngSubmit)="submit()">
      <label class="small muted" for="user">Usuario</label>
      <input id="user" name="username" [(ngModel)]="username" autocomplete="username" required />

      <label class="small muted" for="pass">Contraseña</label>
      <input id="pass" name="password" type="password" [(ngModel)]="password"
             autocomplete="current-password" required />

      @if (error()) {
        <p class="error small">{{ error() }}</p>
      }

      <button class="primary" type="submit" [disabled]="loading() || !username || !password">
        {{ loading() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <div class="demo">
      <span class="small muted">Credenciales de prueba:</span>
      <button class="small" type="button" (click)="fill('admin')">admin</button>
      <button class="small" type="button" (click)="fill('agent')">agente</button>
    </div>
  </div>
</div>
