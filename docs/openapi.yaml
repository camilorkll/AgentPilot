openapi: 3.0.3
info:
  title: AgentPilot API
  description: >
    Copiloto de conocimiento RAG para agentes de Contact Center.
    Contrato diseñado contract-first (Spec Driven Development): este fichero
    es la fuente de verdad de la API; el código se implementa contra él.


    **Campañas (v1.1.0):** toda la documentación pertenece a una campaña y el
    asistente responde **únicamente** con el corpus de la campaña seleccionada.
    Por eso `campaignId` es obligatorio en `POST /chat/ask` y en la subida de
    documentos: es un cambio incompatible respecto a la 1.0.0, deliberado, porque
    un valor por defecto silencioso convertiría un olvido del cliente en una fuga
    de información entre campañas.


    **Prompt por capas (v1.2.0):** las instrucciones propias de una campaña se
    gestionan aparte, en `/campaigns/{campaignId}/prompt`, y ya no viajan dentro
    de `Campaign`/`CampaignRequest` (cambio incompatible respecto a la 1.1.0).
    El asistente compone siempre tres capas — núcleo inmutable (código) + bloque
    de campaña (dato) + reafirmación del núcleo (código) — y esa composición es
    la misma tanto para el chat real como para `POST .../prompt/preview`, para
    que lo que se previsualiza sea exactamente lo que se publica. Cada cambio
    (incluida una restauración) añade una entrada a `/prompt/versions`; ninguna
    entrada existente se reescribe (ver más abajo lo que cambia en la v1.3.0
    sobre cuántas se conservan).


    **Límite de historial de prompt (v1.3.0):** el historial de instrucciones de
    cada campaña conserva como máximo `Campaign.maxPromptVersions` entradas
    (5 por defecto), configurable por campaña con
    `PUT /campaigns/{campaignId}/prompt/max-versions`. Al superarse el límite
    (al publicar o al bajar el propio límite) se elimina automáticamente la
    entrada más antigua. Un administrador también puede borrar una entrada
    concreta con `DELETE /campaigns/{campaignId}/prompt/versions/{versionId}`;
    ninguna de las dos vías de borrado afecta a las instrucciones vigentes de
    la campaña, solo a su histórico. Cambio aditivo, compatible con la 1.2.0.


    **Reindexado sin los ficheros (v1.4.0):** de cada documento se guarda el
    texto extraído, no el fichero original, así que cambiar el troceado o el
    modelo de *embeddings* ya no obliga a que alguien vuelva a subir el corpus
    entero: `POST /documents/reindex` regenera los fragmentos de una campaña a
    partir de ese texto. Los documentos ingeridos antes de que se guardara se
    devuelven en `skipped` con el motivo, porque de esos no hay de dónde
    regenerar nada. Cambio aditivo, compatible con la 1.3.0.


    **Revisión de respuestas valoradas (v1.5.0):** `GET /feedback` (solo
    administrador) devuelve las respuestas que los agentes valoraron, con la
    pregunta, la respuesta y el motivo escrito, filtrables por valoración,
    campaña y operador. Sirve para que un 👎 con motivo llegue a quien puede
    corregir el corpus o el prompt, en vez de morir en la pantalla del agente.
    El listado no expone la conversación completa: el hilo se abre bajo demanda
    con `GET /conversations/{conversationId}`. Cambio aditivo, compatible con
    la 1.4.0.


    **Sustitución no destructiva y orden de las fuentes (v1.6.0):** subir un
    documento con `replace=true` ahora **reprocesa la misma fila** en vez de
    borrarla y crear otra, así que conserva su `id` y sus fragmentos siguen
    respondiendo mientras se procesa el sustituto. Si la ingesta nueva falla, el
    documento se queda en `ready` con el motivo en `errorMessage`: la
    actualización no se aplicó, pero no se ha perdido nada. Además, cada
    `Citation` incorpora `relevance`, la puntuación que fija el orden de las
    fuentes; `score` sigue siendo la similitud del coseno, que no lo explica por
    sí sola. Cambio aditivo, compatible con la 1.5.0.


    **Sesión única por operador (v1.7.0):** `POST /auth/login` **invalida el token
    anterior del mismo usuario**. Un puesto es una persona, y dos sesiones a la vez
    mezclaban las conversaciones de dos clientes bajo el mismo operador, con lo que
    la atribución de métricas y el corte de llamada por inactividad dejaban de
    valer. Gana la última sesión: rechazar el login nuevo dejaría bloqueado hasta
    ocho horas a quien cerrara el navegador sin salir. Las peticiones con un token
    desplazado responden `401` con la cabecera `X-Auth-Error: session_superseded`,
    para que el cliente pueda distinguirlo de un token caducado y decirlo. Cambio de
    comportamiento, no de esquema: compatible con la 1.6.0.
  version: 1.7.0
  contact:
    name: Camilo Rodríguez
    url: https://github.com/camilorkll/AgentPilot

# Producción primero a propósito: Swagger UI preselecciona el primer servidor, y se
# sirve también desde producción (/swagger). Con el orden inverso, un «Try it out»
# desde la Swagger pública salía contra el localhost de quien mirara, y fallaba.
servers:
  - url: https://agentpilot-crk.up.railway.app/api/v1
    description: Producción (Railway)
  - url: http://localhost:8080/api/v1
    description: Desarrollo local (Docker Compose)

tags:
  - name: auth
    description: Autenticación y sesión
  - name: campaigns
    description: Campañas; agrupan la documentación y aíslan el corpus
  - name: documents
    description: Ingesta y gestión de la base de conocimiento
  - name: chat
    description: Conversación RAG con streaming
  - name: feedback
    description: Valoración de respuestas por los agentes
  - name: metrics
    description: Telemetría de uso y coste (LLMOps)
  - name: health
    description: Estado del servicio y diagnóstico de configuración

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Autentica a un usuario y devuelve un JWT
      description: >
        Único endpoint anónimo junto a los de estado. Devuelve un JWT firmado
        (HMAC-SHA256) con el rol en el claim `role`, válido 8 horas. El resto de la
        API espera ese token en la cabecera `Authorization: Bearer`.


        **Abre una sesión nueva y desplaza a la anterior del mismo usuario**: el
        token que hubiera emitido antes deja de valer al instante (claim `sid`). Un
        operador es una persona en un puesto; dos sesiones simultáneas mezclarían las
        conversaciones de dos clientes bajo el mismo nombre. Un intento fallido no
        toca la sesión abierta, para que nadie pueda echar a un agente sabiendo solo
        su usuario.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Autenticación correcta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /campaigns:
    get:
      tags: [campaigns]
      operationId: listCampaigns
      summary: Lista todas las campañas con su estado y volumen de documentación
      description: Requiere rol `admin`.
      responses:
        "200":
          description: Listado de campañas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [campaigns]
      operationId: createCampaign
      summary: Crea una campaña
      description: >
        Requiere rol `admin`. La campaña nace **activa**. El nombre es único
        (sin distinguir mayúsculas).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignRequest"
      responses:
        "201":
          description: Campaña creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Ya existe una campaña con ese nombre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /campaigns/active:
    get:
      tags: [campaigns]
      operationId: listActiveCampaigns
      summary: Campañas activas sobre las que un agente puede trabajar
      description: >
        Alimenta el selector de campaña del agente. Devuelve **solo** las
        campañas en estado `active`, con una proyección reducida: el agente no
        necesita (ni debe ver) las instrucciones del asistente.
      responses:
        "200":
          description: Campañas disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /campaigns/{campaignId}:
    get:
      tags: [campaigns]
      operationId: getCampaign
      summary: Consulta una campaña
      description: Requiere rol `admin`.
      parameters:
        - $ref: "#/components/parameters/CampaignIdPath"
      responses:
        "200":
          description: Campaña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [campaigns]
      operationId: updateCampaign
      summary: Modifica el nombre y las instrucciones del asistente
      description: >
        Requiere rol `admin`. **No cambia el estado**: para eso está
        `POST /campaigns/{campaignId}/status`, porque cerrar una campaña la
        congela y no debe poder ocurrir como efecto secundario de renombrarla.
        Una campaña `closed` es de solo lectura y responde 409.
      parameters:
        - $ref: "#/components/parameters/CampaignIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignRequest"
      responses:
        "200":
          description: Campaña actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La campaña está cerrada, o el nombre ya existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [campaigns]
      operationId: deleteCampaign
      summary: Elimina una campaña y todo su corpus
      description: >
        Requiere rol `admin`. **Solo se permite si la campaña está `closed`**;
        en cualquier otro estado responde 409. Borra en cascada sus documentos y
        fragmentos indexados. Las conversaciones y la telemetría se conservan
        (dejan de apuntar a la campaña pero mantienen su nombre para los
        informes). Es irreversible.
      parameters:
        - $ref: "#/components/parameters/CampaignIdPath"
      responses:
        "204":
          description: Campaña y corpus eliminados
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La campaña no está cerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /campaigns/{campaignId}/status:
    post:
      tags: [campaigns]
      operationId: setCampaignStatus
      summary: Cambia el estado de una campaña
      description: >
        Requiere rol `admin`. Las transiciones válidas son:


        - `active` ⇄ `inactive`

        - `inactive` → `closed` (solo se cierra una campaña ya inactiva)

        - `closed` → `inactive` (reapertura)


        Cualquier otra transición responde 409. Una campaña `closed` conserva
        todo y sus informes siguen consultables, pero no admite cambios en su
        documentación.
      parameters:
        - $ref: "#/components/parameters/CampaignIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignStatusRequest"
      responses:
        "200":
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Transición no permitida desde el estado actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /campaigns/{campaignId}/prompt:
    get:
      tags: [campaigns]
      operationId: getCampaignPrompt
      summary: Instrucciones vigentes de la campaña para el asistente
      description: >
        Requiere rol `admin`. Un objeto con todos los campos vacíos
        (`isEmpty: true`) significa que la campaña no tiene instrucciones
        propias: el asistente responde solo con el núcleo.
      parameters:
        - $ref: "#/components/parameters/CampaignIdPath"
      responses:
        "200":
          description: Instrucciones vigentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantPromptSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [campaigns]
      operationId: updateCampaignPrompt
      summary: Publica unas instrucciones nuevas y añade una entrada al historial
      description: >
        Requiere rol `admin`. Enviar el formulario completamente vacío equivale
        a restaurar el comportamiento por defecto (solo el núcleo). Cada
        llamada crea una entrada nueva en `/prompt/versions` y ninguna entrada
        anterior se reescribe, pero el historial está **acotado**: si con la
        nueva se supera `maxPromptVersions` de la campaña, se elimina la más
        antigua. Una campaña `closed` es de solo lectura y responde 409.
      parameters:
        - $ref: "#/components/parameters/CampaignIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantPromptRequest"
      responses:
        "200":
          description: Instrucciones publicadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptUpdateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/CampaignClosed"

  /campaigns/{campaignId}/prompt/versions:
    get:
      tags: [campaigns]
      operationId: listCampaignPromptVersions
      summary: Historial de instrucciones de la campaña, más reciente primero
      description: >
        Requiere rol `admin`. Incluye también las restauraciones, cada una como
        su propia entrada. Es un registro de auditoría **acotado**, no completo:
        conserva a lo sumo las `maxPromptVersions` últimas entradas de la
        campaña, y un administrador puede borrar una concreta con
        `DELETE .../prompt/versions/{versionId}`. Lo que devuelve es, por tanto,
        lo que ha sobrevivido a esas dos reglas, no todo lo que se publicó.
      parameters:
        - $ref: "#/components/parameters/CampaignIdPath"
      responses:
        "200":
          description: Historial de la campaña
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /campaigns/{campaignId}/prompt/versions/{versionId}/restore:
    post:
      tags: [campaigns]
      operationId: restoreCampaignPromptVersion
      summary: Vuelve a aplicar una versión pasada del historial
      description: >
        Requiere rol `admin`. Restaurar es publicar de nuevo: crea una entrada
        de historial propia, no reescribe ni borra la versión de la que parte.
        Una campaña `closed` es de solo lectura y responde 409.
      parameters:
        - $ref: "#/components/parameters/CampaignIdPath"
        - $ref: "#/components/parameters/VersionIdPath"
      responses:
        "200":
          description: Instrucciones restauradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptUpdateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            La campaña no existe, o la versión no existe o no pertenece a
            esta campaña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/CampaignClosed"

  /campaigns/{campaignId}/prompt/versions/{versionId}:
    delete:
      tags: [campaigns]
      operationId: deleteCampaignPromptVersion
      summary: Borra una entrada concreta del historial
      description: >
        Requiere rol `admin`. A diferencia de la purga automática al superar
        el límite (que solo se lleva la más antigua), esta entrada la elige
        el administrador. No afecta a las instrucciones vigentes de la
        campaña, solo a su histórico. Una campaña `closed` es de solo lectura
        y responde 409.
      parameters:
        - $ref: "#/components/parameters/CampaignIdPath"
        - $ref: "#/components/parameters/VersionIdPath"
      responses:
        "204":
          description: Entrada del historial eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >
            La campaña no existe, o la versión no existe o no pertenece a
            esta campaña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/CampaignClosed"

  /campaigns/{campaignId}/prompt/max-versions:
    put:
      tags: [campaigns]
      operationId: updateCampaignPromptHistoryLimit
      summary: Configura el límite del historial de instrucciones de la campaña
      description: >
        Requiere rol `admin`. Si el histórico ya tiene más entradas que el
        nuevo límite, purga de inmediato las más antiguas hasta ajustarse a
        él. Una campaña `closed` es de solo lectura y responde 409.
      parameters:
        - $ref: "#/components/parameters/CampaignIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptHistoryLimitRequest"
      responses:
        "200":
          description: Campaña con el límite actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/CampaignClosed"

  /campaigns/{campaignId}/prompt/preview:
    post:
      tags: [campaigns]
      operationId: previewCampaignPrompt
      summary: Compara la respuesta con las instrucciones publicadas y con un candidato sin guardar
      description: >
        Requiere rol `admin`. Recupera el contexto **una sola vez** para la
        pregunta de prueba y genera dos respuestas sobre él, para que la
        comparación sea justa. No exige que la campaña esté activa (es de
        solo lectura) y, a propósito, **no crea conversación ni telemetría**:
        no es tráfico real, es una herramienta de administración y no debe
        aparecer en el dashboard de coste ni en el historial de un agente.
      parameters:
        - $ref: "#/components/parameters/CampaignIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptPreviewRequest"
      responses:
        "200":
          description: Respuestas comparadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptPreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /documents:
    post:
      tags: [documents]
      operationId: uploadDocument
      summary: Sube un documento (PDF o Markdown) a una campaña
      description: >
        Requiere rol `admin`. La ingesta es asíncrona: la respuesta devuelve el
        documento en estado `pending`. El pipeline
        (parseo → troceado → embeddings → indexado) se ejecuta en segundo plano y
        el estado se consulta con `GET /documents/{documentId}`.


        El documento queda asociado **exclusivamente** a `campaignId`. Si esa
        campaña ya tiene un fichero con el mismo nombre responde **409**: hay que
        reintentar con `replace=true` para sustituirlo (se elimina el anterior y
        sus fragmentos). El mismo nombre de fichero en **otra** campaña no es
        duplicado.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, campaignId]
              properties:
                file:
                  type: string
                  format: binary
                  description: Fichero .pdf o .md (máx. 20 MB)
                campaignId:
                  type: string
                  format: uuid
                  description: Campaña destino; debe estar `active` o `inactive`
                title:
                  type: string
                  maxLength: 200
                replace:
                  type: boolean
                  default: false
                  description: Sustituye el documento existente con el mismo nombre
      responses:
        "202":
          description: Documento aceptado, ingesta en curso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: La campaña indicada no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Ya existe ese fichero en la campaña (`code: duplicate_document`), o la
            campaña está cerrada (`code: campaign_closed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Fichero demasiado grande
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Formato de fichero no soportado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [documents]
      operationId: listDocuments
      summary: Lista los documentos de la base de conocimiento
      description: >
        Requiere rol `admin`. Sin `campaignId` devuelve los documentos de todas
        las campañas: es una vista de administración, no de consulta del
        asistente. El aislamiento por campaña se aplica en la **recuperación**
        (`POST /chat/ask`), donde no existe la opción de buscar en todas.
      parameters:
        - name: campaignId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/IngestStatus"
      responses:
        "200":
          description: Listado de documentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /documents/{documentId}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: Consulta un documento y el estado de su ingesta
      description: >
        Es la forma de seguir una ingesta asíncrona: el documento pasa por
        `pending` → `processing` → `ready`, o a `failed` con el motivo en
        `errorMessage`.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Documento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Elimina un documento y sus fragmentos indexados
      description: Requiere rol `admin`. Responde 409 si su campaña está cerrada.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Eliminado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/CampaignClosed"

  /documents/{documentId}/content:
    get:
      tags: [documents]
      operationId: getDocumentContent
      summary: Fragmentos indexados de un documento
      description: >
        Requiere rol `admin`. Devuelve los fragmentos tal como los usa la
        búsqueda, que es lo que el asistente puede recuperar y citar. Los
        fragmentos consecutivos se solapan a propósito para no partir ideas por
        la mitad, así que el solapamiento aparece repetido.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Documento con sus fragmentos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /documents/delete:
    post:
      tags: [documents]
      operationId: deleteDocuments
      summary: Elimina varios documentos en una sola operación
      description: >
        Requiere rol `admin`. Se modela como POST y no como DELETE porque lleva
        cuerpo con la lista de identificadores. Los documentos inexistentes se
        devuelven en `notFound` en lugar de fallar: la operación es idempotente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentIdsRequest"
      responses:
        "200":
          description: Resultado del borrado
          content:
            application/json:
              schema:
                type: object
                required: [deleted, notFound]
                properties:
                  deleted: { type: integer }
                  notFound:
                    type: array
                    items: { type: string, format: uuid }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/CampaignClosed"

  /documents/reindex:
    post:
      tags: [documents]
      operationId: reindexCampaign
      summary: Reindexa el corpus de una campaña sin volver a subir los ficheros
      description: >
        Requiere rol `admin`. Vuelve a trocear y vectorizar cada documento a
        partir del **texto guardado en su ingesta**, así que no hace falta
        conservar los ficheros originales. Es lo que hay que ejecutar después de
        cambiar la estrategia de troceado o el modelo de *embeddings*.


        Responde **202**: el trabajo va a la misma cola que la ingesta porque el
        corpus entero puede llevar minutos. Los documentos pasan por
        `processing` y sus fragmentos anteriores siguen sirviendo hasta que se
        sustituyen, así que la campaña no se queda sin responder mientras tanto.


        Los documentos ingeridos **antes de que se guardara el texto** no se
        pueden reindexar y se devuelven en `skipped` con su motivo, en vez de
        omitirse en silencio: de esos hay que volver a subir el fichero.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaignId]
              properties:
                campaignId: { type: string, format: uuid }
      responses:
        "202":
          description: Reindexado encolado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/CampaignClosed"

  /documents/active:
    post:
      tags: [documents]
      operationId: setDocumentsActive
      summary: Activa o desactiva documentos en la base de conocimiento
      description: >
        Requiere rol `admin`. Un documento inactivo **conserva sus fragmentos**
        pero queda fuera de las búsquedas: el asistente no puede recuperarlo ni
        citarlo. Sirve para retirar información con vigencia (una promoción
        caducada) sin perder lo indexado, de modo que reactivarla sea inmediato y
        sin coste de embeddings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveRequest"
      responses:
        "200":
          description: Documentos actualizados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/CampaignClosed"

  /chat/ask:
    post:
      tags: [chat]
      operationId: ask
      summary: Hace una pregunta y recibe la respuesta RAG en streaming (SSE)
      description: >
        Devuelve `text/event-stream`. Eventos emitidos, en este orden:
        `citations` (fragmentos fuente recuperados, **antes** de generar, para que
        el agente vea de inmediato en qué se va a basar la respuesta),
        `token` (deltas de texto), `usage` (tokens, coste y latencia) y `done`.


        La respuesta se construye **únicamente** con el corpus de `campaignId`.
        Si `conversationId` es null se crea una conversación nueva ligada a esa
        campaña; si se envía uno existente, **manda la campaña de la
        conversación** y un `campaignId` distinto responde 409: cambiar de
        campaña exige empezar otra conversación, porque el historial se reenvía
        al modelo en cada turno y arrastraría contenido de la campaña anterior.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      # OpenAPI 3.0 no puede tipar los eventos de un text/event-stream, así que el
      # cuerpo se declara como cadena y los payloads de cada evento quedan
      # descritos aquí, referenciando los esquemas reales en lugar de nombrarlos
      # solo en prosa.
      x-sse-events:
        citations:
          description: Fuentes recuperadas, antes de generar la respuesta
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Citation"
        token:
          description: Delta de texto según lo genera el modelo
          schema:
            type: object
            properties:
              text: { type: string }
        usage:
          description: Tokens, coste y latencia de la llamada
          schema:
            $ref: "#/components/schemas/LlmUsage"
        done:
          description: Fin del stream; devuelve la conversación para el siguiente turno
          schema:
            type: object
            properties:
              conversationId: { type: string, format: uuid }
      responses:
        "200":
          description: Stream de eventos SSE
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  Eventos `citations`, `token`, `usage` y `done` en formato SSE.
                  El payload JSON de cada uno está descrito en `x-sse-events`.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: La campaña o la conversación no existen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            La campaña no está activa (`code: campaign_not_active`), o no coincide
            con la de la conversación (`code: campaign_mismatch`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /conversations/{conversationId}:
    get:
      tags: [chat]
      operationId: getConversation
      summary: Recupera el historial de una conversación
      description: >
        Devuelve los mensajes con las citas de cada respuesta del asistente, para
        poder reconstruir la conversación al recargar la página. Incluye la campaña
        a la que está ligada, que no cambia.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversación con sus mensajes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /feedback:
    post:
      tags: [feedback]
      operationId: submitFeedback
      summary: Valora una respuesta del asistente (👍/👎 + comentario opcional)
      description: >
        La valoración se asocia al mensaje y al operador que la envía, y alimenta el
        indicador de respuestas útiles del panel de métricas. Es la única señal de
        calidad que viene de quien usa el copiloto, no de una medición automática.


        **Una valoración por mensaje.** Volver a valorar el mismo mensaje
        **rectifica** la anterior en vez de añadir otra: el indicador de respuestas
        útiles es positivos entre valoradas, y dos filas para la misma respuesta la
        contarían dos veces. Cambiar de 👎 a 👍 sin enviar `comment` borra el motivo
        anterior, que describía un rechazo que ya no aplica.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "201":
          description: Feedback registrado
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: El mensaje no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [feedback]
      operationId: listRatedAnswers
      summary: Respuestas valoradas, para revisarlas
      description: >
        Requiere rol `admin`: un agente valora, pero no revisa lo que valoraron
        los demás. Devuelve las respuestas valoradas más recientes primero, con
        la pregunta que las provocó, la campaña y el motivo escrito.


        **Devuelve solo el intercambio valorado, no la conversación completa.**
        Para ver el hilo entero hay que pedirlo explícitamente con
        `GET /conversations/{conversationId}`. Es una decisión de privacidad y no
        una limitación técnica: revisar por qué falló una respuesta no exige leer
        todo lo que el cliente contó (ver `SECURITY.md`).
      parameters:
        - name: rating
          in: query
          required: false
          description: Filtra por valoración; ausente devuelve ambas.
          schema:
            type: string
            enum: [positive, negative]
        - name: campaignId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: operator
          in: query
          required: false
          description: >
            Operador que **mantuvo** la conversación (no el que valoró). Los valores
            posibles se obtienen de `GET /metrics/operators`.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Máximo de resultados; se recorta al rango permitido.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Respuestas valoradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RatedAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /metrics/summary:
    get:
      tags: [metrics]
      operationId: getMetricsSummary
      summary: Métricas agregadas de uso, calidad y coste
      description: >
        Requiere rol `admin`. Devuelve los agregados y **una matriz
        `(día, operador)`** en `dailyByOperator`: las dos vistas del panel
        (Agente → Días y Día → Agentes) son la misma matriz agrupada de dos
        maneras, así que se calcula una vez y se pivota en el cliente.


        Los totales mensuales vienen del servidor y no se calculan sumando la
        matriz: las preguntas y el coste son aditivos, pero la latencia media y el
        porcentaje de respuestas útiles no lo son, y promediar promedios da un
        número equivocado.


        Los días y los meses se agrupan en hora de **Europe/Madrid**, no en UTC:
        una consulta de las 00:30 pertenece al día que el supervisor espera.
      parameters:
        - name: monthFrom
          in: query
          required: false
          description: >
            Mes inicial `YYYY-MM`. Si se omiten ambos meses se devuelve el mes en
            curso; si solo se indica este, desde él hasta el mes actual.
          schema:
            $ref: "#/components/schemas/Month"
        - name: monthTo
          in: query
          required: false
          description: Mes final `YYYY-MM`, inclusive. No puede ser anterior a `monthFrom`.
          schema:
            $ref: "#/components/schemas/Month"
        - name: operator
          in: query
          required: false
          description: >
            Operador a incluir. Se repite para filtrar por varios
            (`?operator=agente&operator=supervisor`). Omitido = todos.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: campaignId
          in: query
          required: false
          description: >
            Campaña a la que limitar el informe. El valor especial `none` devuelve
            la actividad anterior a la existencia de campañas, que no tiene
            ninguna asignada; sin este parámetro se incluye todo.
          schema: { type: string }
        - name: from
          in: query
          required: false
          deprecated: true
          description: Rango por fecha exacta. Sustituido por `monthFrom`/`monthTo`.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          deprecated: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Resumen de métricas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /metrics/operators:
    get:
      tags: [metrics]
      operationId: getMetricsOperators
      summary: Operadores que han usado el copiloto
      description: Requiere rol `admin`. Alimenta el filtro de multiselección.
      responses:
        "200":
          description: Nombres de operador, ordenados alfabéticamente
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /metrics/export.csv:
    get:
      tags: [metrics]
      operationId: exportMetricsCsv
      summary: Exporta a CSV la actividad diaria por operador
      description: >
        Requiere rol `admin`. Acepta **exactamente los mismos parámetros** que
        `/metrics/summary` y reutiliza su consulta, de modo que «respetar los
        filtros aplicados» es cierto por construcción y no algo que haya que
        mantener sincronizado en dos sitios.


        Formato pensado para abrirse en Excel en español: **UTF-8 con BOM**,
        separador `;` y coma decimal. Contiene **solo filas de detalle**, sin
        subtotales: los totales se ven en pantalla, y un CSV con líneas de total
        intercaladas es hostil para una tabla dinámica.
      parameters:
        - name: monthFrom
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Month"
        - name: monthTo
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Month"
        - name: operator
          in: query
          required: false
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: campaignId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: >
            Fichero CSV con las columnas
            `Mes;Fecha;Operador;Preguntas;Coste USD;Latencia media ms;% útiles`
          headers:
            Content-Disposition:
              description: 'attachment; filename="metricas-2026-08.csv"'
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Healthcheck del servicio
      description: >
        Sonda que usa la plataforma de despliegue para decidir si la réplica está
        viva. Responde en cuanto la aplicación arranca, sin esperar a la base de
        datos: la migración corre en segundo plano y bloquear aquí impediría
        diagnosticar un problema de conexión.
      security: []
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: Healthy }

  /health/database:
    get:
      tags: [health]
      operationId: getDatabaseHealth
      summary: Diagnóstico de la conexión y del esquema
      description: >
        Anónimo a propósito, para poder diagnosticar un despliegue que aún no
        permite autenticarse. **No revela valores de configuración.**
      security: []
      responses:
        "200":
          description: Estado de la base de datos
          content:
            application/json:
              schema:
                type: object
                properties:
                  canConnect: { type: boolean }
                  pendingMigrations:
                    type: array
                    items: { type: string }
                  error: { type: string, nullable: true }

  /health/config:
    get:
      tags: [health]
      operationId: getConfigHealth
      summary: Diagnóstico de la configuración presente
      description: >
        Anónimo a propósito. Indica **si** cada valor está configurado, nunca su
        contenido: de los secretos solo se expone un booleano o su longitud.
      security: []
      responses:
        "200":
          description: Configuración detectada
          content:
            application/json:
              schema:
                type: object
                properties:
                  openAiApiKey: { type: boolean }
                  jwtSigningKey: { type: boolean }
                  jwtSigningKeyBytes: { type: integer }
                  connectionString: { type: boolean }
                  chatProvider: { type: string, description: "openai (por defecto) u ollama (solo local, comparativa)" }
                  chatModel: { type: string }
                  chatModelLooksValid: { type: boolean }
                  embeddingsProvider: { type: string }
                  sentryEnabled: { type: boolean }
                  seededUsers: { type: integer }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignIdPath:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionIdPath:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Petición inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >
        Sin autenticar, token inválido o **sesión desplazada** por un login posterior
        del mismo usuario.
      headers:
        X-Auth-Error:
          description: >
            Presente solo cuando el motivo es que otra sesión del mismo operador ha
            desplazado a esta (`session_superseded`). Sirve para distinguirlo de un
            token caducado, que necesita otro mensaje: al agente hay que decirle que
            su usuario ha entrado en otro sitio, no que vuelva a intentarlo.
          schema:
            type: string
            enum: [session_superseded]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Autenticado pero sin permisos suficientes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CampaignClosed:
      description: >
        La campaña está cerrada y su documentación es de solo lectura
        (`code: campaign_closed`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 100 }
        password: { type: string, format: password, maxLength: 200 }

    LoginResponse:
      type: object
      required: [accessToken, role, expiresAtUtc]
      properties:
        accessToken: { type: string }
        role:
          type: string
          enum: [agent, admin]
        expiresAtUtc: { type: string, format: date-time }

    CampaignStatus:
      type: string
      description: >
        Ciclo de vida de una campaña. Se persiste como entero
        (`inactive` = 0, `active` = 1, `closed` = 2) y se expone con nombre para
        que el contrato se lea sin tabla de conversión.


        - `active`: visible para los agentes y respondiendo consultas.

        - `inactive`: retirada del selector; su documentación aún se puede editar.

        - `closed`: solo lectura. Conserva todo y sus informes siguen
        consultables, pero no admite cambios; es el único estado desde el que se
        puede eliminar.
      enum: [inactive, active, closed]

    Campaign:
      type: object
      required: [id, name, status, documentCount, createdAtUtc, maxPromptVersions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        status:
          $ref: "#/components/schemas/CampaignStatus"
        documentCount:
          type: integer
          description: Documentos de la campaña, en cualquier estado de ingesta
        activeDocumentCount:
          type: integer
          description: Documentos indexados y activos, es decir consultables por el asistente
        closedAtUtc: { type: string, format: date-time, nullable: true }
        createdAtUtc: { type: string, format: date-time }
        maxPromptVersions:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
          description: >
            Cuántas entradas conserva como máximo el historial de instrucciones
            de esta campaña (`/prompt/versions`). Al superarse se elimina la
            más antigua; se cambia con
            `PUT /campaigns/{campaignId}/prompt/max-versions`.

    CampaignSummary:
      type: object
      description: Proyección para el selector del agente, sin datos de configuración.
      required: [id, name, activeDocumentCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        activeDocumentCount:
          type: integer
          description: >
            Documentos consultables. A cero, el asistente solo podrá abstenerse,
            y conviene que el agente lo sepa antes de preguntar.

    CampaignRequest:
      type: object
      description: >
        Solo el nombre: las instrucciones del asistente se gestionan aparte,
        en `/campaigns/{campaignId}/prompt`.
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }

    CampaignStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/CampaignStatus"

    AssistantPromptRequest:
      type: object
      description: >
        Instrucciones propias de una campaña para el asistente: negocio (tono,
        avisos, vocabulario), nunca reglas del sistema. Todos los campos son
        opcionales; un objeto completamente vacío equivale a restaurar el
        comportamiento por defecto (solo el núcleo).
      properties:
        tone:
          type: string
          enum: [cercano, neutro, formal]
          nullable: true
        detailLevel:
          type: string
          enum: [breve, normal, detallado]
          nullable: true
        mandatoryNotice:
          type: string
          maxLength: 300
          nullable: true
          description: Aviso que el asistente debe recordar siempre (p. ej. verificar identidad)
        avoidWords:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 60 }
        extraInstructions:
          type: string
          maxLength: 2000
          nullable: true
          description: Texto libre acotado; único campo sin estructura del formulario

    AssistantPromptSettings:
      description: >
        Instrucciones vigentes de la campaña, tal como las devuelve la API
        (a diferencia de AssistantPromptRequest, aquí avoidWords e isEmpty
        siempre están presentes).
      type: object
      required: [avoidWords, isEmpty]
      properties:
        tone:
          type: string
          enum: [cercano, neutro, formal]
          nullable: true
        detailLevel:
          type: string
          enum: [breve, normal, detallado]
          nullable: true
        mandatoryNotice:
          type: string
          maxLength: 300
          nullable: true
        avoidWords:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 60 }
        extraInstructions:
          type: string
          maxLength: 2000
          nullable: true
        isEmpty:
          type: boolean
          description: >
            True si ningún campo está informado: el asistente responde
            solo con el núcleo, igual que antes de que existiera esta función.

    PromptUpdateResponse:
      type: object
      required: [prompt, warnings, versionId, createdAtUtc]
      properties:
        prompt:
          $ref: "#/components/schemas/AssistantPromptSettings"
        warnings:
          type: array
          items: { type: string }
          description: >
            Avisos de lint no bloqueantes: patrones en el texto libre o el
            aviso que sugieren un intento de anular el núcleo (p. ej.
            "ignora", "responde siempre"). Se publica igualmente: el núcleo
            se reafirma después de este bloque de todos modos.
        versionId: { type: string, format: uuid }
        createdAtUtc: { type: string, format: date-time }

    PromptVersion:
      type: object
      required: [id, prompt, publishedBy, createdAtUtc]
      properties:
        id: { type: string, format: uuid }
        prompt:
          $ref: "#/components/schemas/AssistantPromptSettings"
        publishedBy:
          type: string
          description: Usuario autenticado que publicó este cambio (o restauración)
        createdAtUtc: { type: string, format: date-time }

    PromptHistoryLimitRequest:
      type: object
      required: [maxVersions]
      properties:
        maxVersions:
          type: integer
          minimum: 1
          maximum: 50
          description: Nuevo límite de entradas del historial de instrucciones de la campaña

    PromptPreviewRequest:
      allOf:
        - $ref: "#/components/schemas/AssistantPromptRequest"
        - type: object
          required: [question]
          properties:
            question:
              type: string
              minLength: 1
              description: Pregunta de prueba, resuelta contra el corpus real de la campaña

    PromptPreviewResponse:
      type: object
      required: [currentAnswer, candidateAnswer, citations, warnings]
      properties:
        currentAnswer:
          type: string
          description: Respuesta con las instrucciones publicadas actualmente
        candidateAnswer:
          type: string
          description: Respuesta con el candidato del cuerpo de la petición, sin guardar
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
          description: >
            Mismo contexto recuperado para ambas respuestas: la comparación es
            sobre el prompt, no sobre qué encontró la búsqueda
        warnings:
          type: array
          items: { type: string }

    IngestStatus:
      type: string
      enum: [pending, processing, ready, failed]

    Document:
      type: object
      required: [id, campaignId, title, fileName, status, isActive, createdAtUtc]
      properties:
        id: { type: string, format: uuid }
        campaignId:
          type: string
          format: uuid
          description: Campaña a la que pertenece; no cambia una vez creado
        title: { type: string }
        fileName: { type: string }
        status:
          $ref: "#/components/schemas/IngestStatus"
        isActive:
          type: boolean
          description: >
            Si es false, conserva sus fragmentos pero queda fuera de las búsquedas
        chunkCount: { type: integer, nullable: true }
        embeddingModel:
          type: string
          nullable: true
          description: Modelo con el que se indexó (los queries deben usar el mismo)
        errorMessage: { type: string, nullable: true }
        createdAtUtc: { type: string, format: date-time }

    ReindexResult:
      type: object
      description: Qué documentos se han encolado para reindexar y cuáles no.
      required: [queued, queuedDocumentIds, skipped]
      properties:
        queued:
          type: integer
          description: Cuántos documentos se van a reindexar en segundo plano
        queuedDocumentIds:
          type: array
          items: { type: string, format: uuid }
        skipped:
          type: array
          description: >
            Documentos que no se pueden reindexar. Se devuelven con el motivo
            para que el administrador sepa de cuáles tiene que volver a subir el
            fichero, en vez de descubrirlo cuando esos documentos respondan peor.
          items:
            type: object
            required: [documentId, fileName, reason]
            properties:
              documentId: { type: string, format: uuid }
              fileName: { type: string }
              reason: { type: string }

    DocumentChunk:
      type: object
      required: [ordinal, content, charCount]
      properties:
        ordinal: { type: integer }
        content: { type: string }
        charCount: { type: integer }

    DocumentContent:
      type: object
      required: [id, title, fileName, chunks]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        fileName: { type: string }
        embeddingModel: { type: string, nullable: true }
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/DocumentChunk"

    DocumentIdsRequest:
      type: object
      required: [documentIds]
      properties:
        documentIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }

    SetActiveRequest:
      type: object
      required: [documentIds, isActive]
      properties:
        documentIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        isActive: { type: boolean }

    AskRequest:
      type: object
      required: [question, campaignId]
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 2000
        campaignId:
          type: string
          format: uuid
          description: >
            Campaña sobre la que se responde. Obligatorio y sin valor por
            defecto: es la frontera que impide usar documentación de otra campaña.
        conversationId:
          type: string
          format: uuid
          nullable: true

    Citation:
      type: object
      required: [documentId, documentTitle, chunkId, snippet, score]
      properties:
        documentId: { type: string, format: uuid }
        documentTitle: { type: string }
        chunkId: { type: string, format: uuid }
        snippet:
          type: string
          description: Fragmento del documento fuente usado en la respuesta
        score:
          type: number
          format: double
          description: >
            Similitud del coseno entre la pregunta y el fragmento (0..1). Mide
            parecido de significado, y por sí sola NO explica el orden de la
            lista: para eso está `relevance`.
        relevance:
          type: number
          format: double
          nullable: true
          description: >
            Puntuación con la que se ordenaron las fuentes: combina la similitud
            vectorial con el solape léxico respecto a la pregunta. Es la que
            explica por qué una cita va antes que otra — ordenar por una y
            mostrar la otra hacía parecer desordenada una lista que no lo
            estaba. Null en las citas guardadas antes de registrarla.

    LlmUsage:
      type: object
      required: [model, promptTokens, completionTokens, latencyMs]
      properties:
        model: { type: string, example: gpt-4o-mini }
        promptTokens: { type: integer }
        cachedPromptTokens: { type: integer }
        completionTokens: { type: integer }
        estimatedCostUsd: { type: number, format: double }
        latencyMs: { type: integer }

    Message:
      type: object
      required: [id, role, content, createdAtUtc]
      properties:
        id: { type: string, format: uuid }
        role:
          type: string
          enum: [user, assistant]
        content: { type: string }
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        createdAtUtc: { type: string, format: date-time }
        feedback:
          allOf:
            - $ref: "#/components/schemas/MessageFeedback"
          nullable: true
          description: >
            Valoración vigente de esta respuesta, o ausente si nadie la ha
            valorado. Hay como mucho una por mensaje.

    MessageFeedback:
      type: object
      description: >
        Valoración que un operador dio a una respuesta. Viaja con la conversación
        para que al reabrirla se vea lo ya votado en vez de ofrecer votar de nuevo.
      required: [rating, createdAtUtc]
      properties:
        rating:
          type: string
          enum: [positive, negative]
        comment:
          type: string
          maxLength: 1000
          nullable: true
          description: Motivo, normalmente solo en las valoraciones negativas
        createdBy:
          type: string
          nullable: true
          description: Quién valoró por última vez (una rectificación sustituye al anterior)
        createdAtUtc: { type: string, format: date-time }

    Conversation:
      type: object
      required: [id, messages, createdAtUtc]
      properties:
        id: { type: string, format: uuid }
        campaignId:
          type: string
          format: uuid
          nullable: true
          description: >
            Campaña de la conversación, fijada al crearla e inmutable. Null en las
            conversaciones anteriores a la existencia de campañas.
        title: { type: string, nullable: true }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        createdAtUtc: { type: string, format: date-time }

    RatedAnswer:
      type: object
      description: >
        Una respuesta valorada con el contexto mínimo para juzgarla: la pregunta
        que la provocó, la campaña y el motivo escrito. **No** incluye el resto de
        la conversación.
      required: [messageId, conversationId, answer, rating, ratedAtUtc]
      properties:
        messageId:
          type: string
          format: uuid
          description: Respuesta valorada
        conversationId:
          type: string
          format: uuid
          description: Hilo al que pertenece, para pedirlo entero si hace falta
        campaignId: { type: string, format: uuid, nullable: true }
        campaignName:
          type: string
          nullable: true
          description: >
            Null si la conversación es anterior a las campañas o si la campaña
            se eliminó (el hilo se conserva; ver `Conversation.campaignId`).
        question:
          type: string
          nullable: true
          description: Pregunta del agente inmediatamente anterior a la respuesta
        answer: { type: string }
        rating:
          type: string
          enum: [positive, negative]
        comment:
          type: string
          nullable: true
          description: Motivo escrito por el agente, normalmente solo en las negativas
        ratedBy:
          type: string
          nullable: true
          description: Quién valoró la respuesta
        ratedAtUtc: { type: string, format: date-time }
        operator:
          type: string
          nullable: true
          description: >
            Quién mantuvo la conversación. Casi siempre coincide con `ratedBy`, pero
            son acciones distintas. Null en las conversaciones anteriores a que se
            registrara el operador y que no se pudieron atribuir desde la telemetría.

    FeedbackRequest:
      type: object
      required: [messageId, rating]
      properties:
        messageId: { type: string, format: uuid }
        rating:
          type: string
          enum: [positive, negative]
        comment:
          type: string
          maxLength: 1000
          nullable: true

    Month:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      example: 2026-08
      description: Mes en formato `YYYY-MM`; sin día, porque el filtro es mensual.

    OperatorUsage:
      type: object
      required: [userName, questions, totalCostUsd, avgLatencyMs]
      properties:
        userName: { type: string }
        questions: { type: integer }
        totalCostUsd: { type: number, format: double }
        avgLatencyMs: { type: number, format: double }
        positiveFeedbackRate:
          type: number
          format: double
          nullable: true
          description: Ratio 0..1; null si ese operador aún no tiene valoraciones

    DailyOperatorUsage:
      type: object
      description: Actividad de un operador en un día concreto (hora de Europe/Madrid).
      required: [date, userName, questions, costUsd, avgLatencyMs]
      properties:
        date: { type: string, format: date }
        userName: { type: string }
        questions: { type: integer }
        costUsd: { type: number, format: double }
        avgLatencyMs: { type: number, format: double }
        positiveFeedbackRate: { type: number, format: double, nullable: true }

    MonthlyTotal:
      type: object
      description: >
        Total de un mes. Con `userName` es el total de ese operador en el mes
        (vista Agente → Días); con `userName` a null es el total de todos los
        operadores incluidos en el filtro (vista Día → Agentes).
      required: [month, questions, costUsd, avgLatencyMs]
      properties:
        month:
          $ref: "#/components/schemas/Month"
        userName: { type: string, nullable: true }
        questions: { type: integer }
        costUsd: { type: number, format: double }
        avgLatencyMs: { type: number, format: double }
        positiveFeedbackRate: { type: number, format: double, nullable: true }

    MetricsSummary:
      type: object
      properties:
        totalQuestions: { type: integer }
        positiveFeedbackRate:
          type: number
          format: double
          nullable: true
          description: >
            Proporción de respuestas útiles sobre las **valoradas**
            (`positiveAnswers` / `ratedAnswers`), no sobre `totalQuestions`.
            Valorar es voluntario, así que el denominador suele ser mucho menor
            que el total de preguntas. Null si nadie ha valorado todavía.
        ratedAnswers:
          type: integer
          description: Denominador de `positiveFeedbackRate`.
        positiveAnswers:
          type: integer
          description: Numerador de `positiveFeedbackRate`.
        avgLatencyMs: { type: number, format: double }
        p95LatencyMs: { type: number, format: double }
        totalCostUsd: { type: number, format: double }
        costByModel:
          type: object
          additionalProperties: { type: number, format: double }
        costByCampaign:
          type: object
          additionalProperties: { type: number, format: double }
          description: >
            Coste por nombre de campaña. El nombre va desnormalizado en la
            telemetría, así que el informe sigue leyéndose después de eliminar una
            campaña.
        questionsPerDay:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              count: { type: integer }
        byOperator:
          type: array
          description: Desglose por operador, de mayor a menor uso
          items:
            $ref: "#/components/schemas/OperatorUsage"
        dailyByOperator:
          type: array
          description: >
            Matriz (día, operador) que alimenta las dos vistas del panel. Solo
            incluye las combinaciones con actividad: los días sin uso no aparecen.
          items:
            $ref: "#/components/schemas/DailyOperatorUsage"
        monthlyTotals:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyTotal"
        filteredOperators:
          type: array
          description: Operadores incluidos; vacío significa todos
          items: { type: string }
        monthFrom:
          $ref: "#/components/schemas/Month"
        monthTo:
          $ref: "#/components/schemas/Month"
        campaignId:
          type: string
          nullable: true
          description: Campaña aplicada al informe; null si no se filtró

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: validation_error }
        message: { type: string }
        details:
          type: array
          items: { type: string }
          nullable: true

security:
  - bearerAuth: []
